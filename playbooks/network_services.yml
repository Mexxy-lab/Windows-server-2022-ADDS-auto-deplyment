
---
- name: Configure DHCP and internal network NAT
  hosts: domain_controller
  gather_facts: false

  vars_files:
    - ../group_vars/windows.yml
    - ../group_vars/vault.yml

  vars:
    ansible_user: 'PUMEJLAB\Administrator'
    ansible_password: "{{ domain_admin_password }}"

  tasks:
    # ------------------------------------------------
    # 1. Install DHCP and Remote Access features
    # ------------------------------------------------
    - name: Install DHCP and Remote Access features
      ansible.windows.win_feature:
        name:
          - DHCP
          - RemoteAccess
          - Routing
        state: present
        include_management_tools: true
      register: network_features

    - name: Reboot if Windows requires it after feature installation
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        post_reboot_delay: 30
      when: network_features.reboot_required | default(false)

    # ------------------------------------------------
    # 2. Configure DHCP using the PowerShell script
    # ------------------------------------------------
    - name: Configure DHCP server, scope, DNS and gateway
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', '../scripts/Configure-DHCP.ps1') }}"
        parameters:
          DomainName: "{{ domain_name }}"
          ServerIP: "{{ domain_controller_internal_ip }}"
          ScopeNetwork: "10.20.0.0"
          StartRange: "{{ dhcp_start_range }}"
          EndRange: "{{ dhcp_end_range }}"
          SubnetMask: "{{ dhcp_subnet_mask }}"
          DefaultGateway: "{{ domain_controller_internal_ip }}"
          DnsServer: "{{ domain_dns_server }}"
          ScopeName: "AD-Lab-Internal"
      register: dhcp_result
      no_log: true

    - name: Display DHCP configuration summary
      ansible.builtin.debug:
        msg: "DHCP configuration script completed on the domain controller."

    # ------------------------------------------------
    # 3. Configure internal routing and NAT
    # ------------------------------------------------
    - name: Configure routing and NAT using PowerShell
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', '../scripts/Configure-RoutingNAT.ps1') }}"
        parameters:
          InternalIP: "{{ domain_controller_internal_ip }}"
          InternalPrefix: "{{ internal_network }}"
          NatName: "ADLabNAT"
      register: nat_result

    - name: Display routing and NAT result
      ansible.builtin.debug:
        var: nat_result.output
