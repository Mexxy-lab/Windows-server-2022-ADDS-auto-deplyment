---
- name: Validate Active Directory deployment
  hosts: domain_controller
  gather_facts: false

  vars_files:
    - ../group_vars/windows.yml
    - ../group_vars/vault.yml

  vars:
    ansible_user: 'PUMEJLAB\Administrator'
    ansible_password: "{{ domain_admin_password }}"

  tasks:
    - name: Verify domain, required OUs, and user accounts
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $domain = Get-ADDomain -Identity '{{ domain_name }}' -ErrorAction Stop

          $requiredOUs = @(
            'Admins', 'Management', 'IT',
            'HR', 'Marketing', 'Sales'
          )

          foreach ($name in $requiredOUs) {
            $dn = "OU=$name,$($domain.DistinguishedName)"
            Get-ADOrganizationalUnit -Identity $dn -ErrorAction Stop |
              Out-Null
          }

          $csvPath = 'C:\Temp\ADLab\user_accounts_final.csv'
          if (-not (Test-Path $csvPath)) {
            throw "Expected user CSV is missing."
          }

          $rows = @(Import-Csv -Path $csvPath)

          if ($rows.Count -ne 119) {
            throw "Expected 119 CSV accounts; found $($rows.Count)."
          }

          $failures = @(
            foreach ($row in $rows) {
              $user = Get-ADUser `
                -Filter "SamAccountName -eq '$($row.username)'" `
                -Properties UserPrincipalName, DistinguishedName `
                -ErrorAction SilentlyContinue

              $expectedOuDn = ([string]$row.OU).Trim()
              if ($expectedOuDn -notmatch '^OU=') {
                $expectedOuDn = "OU=$expectedOuDn,$($domain.DistinguishedName)"
              }

              if (-not $user) {
                $row.username
                continue
              }

              $actualParentDn = $user.DistinguishedName.Substring(
                $user.DistinguishedName.IndexOf(',') + 1
              )

              if ($user.UserPrincipalName -ne $row.UPN -or
                  -not $actualParentDn.Equals(
                    $expectedOuDn,
                    [System.StringComparison]::OrdinalIgnoreCase
                  )) {
                $row.username
              }
            }
          )

          if ($failures.Count -gt 0) {
            throw "Account validation failed for $($failures.Count) entries."
          }

          Write-Output "VALIDATION_OK: Domain, six OUs, and 119 accounts verified."
      register: ad_validation
      no_log: true

    - name: Report validation success
      ansible.builtin.debug:
        msg: "Active Directory validation passed."
